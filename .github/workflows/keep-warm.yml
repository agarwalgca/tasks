name: Keep Supabase awake

# Free-tier Supabase projects pause after about a week with no database
# activity, which takes the app offline until it is restored by hand. This runs
# a real query daily so the project never goes idle that long.
#
# Note: GitHub disables scheduled workflows in a repository with no activity for
# 60 days. If this repo goes quiet for that long, re-enable it from the Actions
# tab — or just push something.

on:
  schedule:
    # Daily at 04:17 UTC (09:47 IST). Off the hour, since scheduled runs on the
    # hour are the most likely to be delayed.
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # A select through PostgREST is what counts as activity — it opens a
          # real connection to Postgres. A health-check ping would not.
          # RLS returns an empty array to an anonymous caller, which is fine:
          # the query still ran.
          status=$(curl -sS --max-time 30 -o response.json -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/tasks?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP ${status}"
          cat response.json
          echo

          if [ "${status}" != "200" ]; then
            echo "::error::Supabase did not answer with 200 — the project may be paused or still restoring."
            exit 1
          fi
          echo "Project is awake."
